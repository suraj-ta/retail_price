# Azure DevOps Pipeline for deploying ML models via Seldon and ArgoCD
trigger:
- none

variables:
- group: Argocd

pool:
  vmImage: ubuntu-latest

parameters:
  - name: model_name
    displayName: 'Model Name'
    type: string
    default: 'model_retail_prices_2908_v2'
  - name: model_version
    displayName: 'Model Version'
    type: number
    default: 3
  - name: deployment_env
    displayName: 'Deployment Environment'
    type: string
    values:
      - 'dev'
      - 'stag'
      - 'prod'
    default: dev
  - name: model_server
    displayName: 'Model Server'
    type: string
    default: SKLEARN_CUSTOM_SERVER
  - name: model_artifact_id
    displayName: 'Model Artifact'
    type: string
    default: 12345
  - name: platform_env
    displayName: 'Platform ENV'
    type: string
    values:
      - 'dev'
      - 'stag'
      - 'prod'
    default: dev

stages:

# Stage 1: Databricks → Azure Blob
- stage: Databricks_to_blob
  displayName: "Stage 1: Databricks → Azure Blob"
  jobs:
  - job: Databricks_to_blob
    displayName: "Job: Download and Upload Model"
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r workers/requirements.txt
        python -m pip install "mlflow[databricks]>=2.9.0"
        mkdir -p databricks_download
      displayName: 'Install Python packages'

    - task: PythonScript@0
      displayName: 'Download model from Databricks'
      inputs:
        scriptSource: filePath
        scriptPath: workers/databricks_handler/databricks_artifact_downloader.py
        arguments: $(${{parameters.platform_env}}-host) $(${{parameters.platform_env}}-token) "${{parameters.model_name}}" ${{parameters.model_version}}

    - task: Bash@3
      displayName: 'Rename model to .joblib'
      inputs:
        targetType: 'inline'
        script: |
          if [ -f databricks_download/python_model.pkl ]; then
            mv databricks_download/python_model.pkl databricks_download/model.joblib
            echo "Renamed python_model.pkl → model.joblib ✅"
          else
            echo "No python_model.pkl found ⚠️"
          fi

    - task: PythonScript@0
      displayName: 'Upload model to Azure Blob Storage'
      inputs:
        scriptSource: filePath
        scriptPath: workers/databricks_handler/artifact_uploader.py
        arguments: $(azureblobaccountname) $(azureblobaccountkey) model-${{parameters.model_artifact_id}} ${{parameters.deployment_env}} ${{parameters.model_version}} databricks_download/model.joblib

# Stage 2: Update Manifest
- stage: manifest_updater
  displayName: "Stage 2: Update Manifest"
  jobs:
  - job: manifest_updater
    displayName: "Job: Pull → Update → Push Manifest"
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true

    - task: Bash@3
      displayName: 'Pull manifest repo'
      inputs:
        targetType: 'inline'
        script: |
          rm -rf mlopsplatform
          git clone https://$(azure_repo_pat_token)@dev.azure.com/tamlopsplatform/mlopsplatform/_git/mlopsplatform
          ls -R mlopsplatform

    - task: Bash@3
      displayName: 'Install Python packages'
      inputs:
        targetType: 'inline'
        script: |
          python -m pip install --upgrade pip
          python -m pip install -r mlopsplatform/workers/requirements.txt

    - task: PythonScript@0
      displayName: 'Update manifest'
      inputs:
        scriptSource: filePath
        scriptPath: mlopsplatform/workers/manifest_handler/manfiest_updater.py
        workingDirectory: mlopsplatform
        arguments: model-${{parameters.model_artifact_id}} ${{parameters.deployment_env}} ${{parameters.model_version}} ${{parameters.model_server}}

    - task: Bash@3
      displayName: 'Push updated manifest'
      inputs:
        targetType: 'inline'
        script: |
          cd mlopsplatform
          git config user.name "Devops pipeline"
          git config user.email "nayana.kumari@tigeranalytics.com"
          git add .
          if git commit -m "Push from dev pipeline"; then
              echo "✅ Changes committed"
              git push
          else
              echo "ℹ️ No changes to commit"
          fi

# Stage 3: Deploy via ArgoCD
- stage: argocd_application_creator
  displayName: "Stage 3: Deploy via ArgoCD"
  jobs:
  - job: argocd_application_creator
    displayName: "Job: Create ArgoCD application"
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.9'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r workers/requirements.txt
      displayName: 'Install Python packages'

    - task: PythonScript@0
      displayName: 'Create ArgoCD Application'
      inputs:
        scriptSource: filePath
        scriptPath: workers/argocd_handler/argocd_application_creator.py
        arguments: $(argocd_username) $(argocd_password) $(argocd_url) model-${{parameters.model_artifact_id}} ${{parameters.deployment_env}} ${{parameters.deployment_env}}
