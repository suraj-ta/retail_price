    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #         python workers/argocd_handler/argocd_application_creator.py $(argocd_username) $(argocd_password) $(argocd_url) "${{parameters.model_name}}" ${{parameters.deployment_env}}




